name: Test Auth Pipeline

on:
  # This listens for the API trigger
  repository_dispatch:
    types: [deploy_to_cloudflare]

jobs:
  test-auth:
    runs-on: ubuntu-latest

    steps:
      - name: Validate Authentication Token
        env:
          # Reads the auth_token key from the client_payload object
          AUTH_TOKEN: ${{ github.event.client_payload.auth_token }}
        run: |
          if [ -z "$AUTH_TOKEN" ]; then
            echo "❌ unauthorized: No auth token provided!"
            exit 1
          else
            echo "✅ authorized: Token successfully received."
          fi
